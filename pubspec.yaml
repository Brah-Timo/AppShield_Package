name: app_shield
description: >
  Professional licensing & activation system for Flutter apps.
  Supports online/offline validation, device binding, feature flags,
  anti-tampering, subscriptions, and trial periods.
  Works on Windows, macOS, Linux, Android, iOS, and Web.
version: 1.0.0
homepage: https://appshield.dev
repository: https://github.com/yourcompany/app_shield
issue_tracker: https://github.com/yourcompany/app_shield/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────────────────────
  http: ^1.2.0
  dio: ^5.4.0
  # connectivity_plus 6.1.x: Dart >=3.2, web >=0.5.0 compatible
  connectivity_plus: ^6.1.5

  # ── Secure Storage ──────────────────────────────────────────────────────
  shared_preferences: ^2.3.0
  # flutter_secure_storage 9.x: Windows/Linux desktop support
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # ── Cryptography ────────────────────────────────────────────────────────
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.7.4

  # ── Device Information ────────────────────────────────────────────────
  # device_info_plus 10.0.0 is RETRACTED. Use 11.x (Dart >=3.3, web >=0.5.0).
  device_info_plus: ^11.1.1
  # package_info_plus 5.0.0/5.0.1 are RETRACTED. Use 8.x (Dart >=3.3, web >=0.5.0).
  package_info_plus: ^8.1.4
  # network_info_plus 5.0.0 is RETRACTED. Use 6.x (Dart >=2.18).
  network_info_plus: ^6.1.4

  # ── JWT ─────────────────────────────────────────────────────────────────
  dart_jsonwebtoken: ^2.12.0

  # ── State Management ─────────────────────────────────────────────────────
  provider: ^6.1.1

  # ── UI ──────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  intl: ^0.19.0

  # ── Platform-specific (Desktop) ──────────────────────────────────────────
  ffi: ^2.1.0

flutter:
  assets:
    - assets/animations/
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

# ── Dependency overrides ────────────────────────────────────────────────────
# Force a single compatible version of the `web` package so that all
# plus_plugins (device_info_plus 11.x, package_info_plus 8.x,
# connectivity_plus 6.x, network_info_plus 6.x) resolve cleanly.
# All of those packages require web >=0.5.0; we pin to 1.x which satisfies
# every >=0.5.0 constraint while staying below the upper bound of any
# package that uses <2.0.0.
dependency_overrides:
  web: ^1.1.0
